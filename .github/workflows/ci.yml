name: ci

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # any arg works to install the binary onto PATH; healthcheck is
          # lightweight and validates the installed binary
          args: healthcheck

      - name: Validate GoReleaser config
        # `brews` is intentionally kept (homebrew_casks is macOS-only; we need
        # a Formula for Linuxbrew too). `goreleaser check` exit codes:
        #   0 = clean, 1 = invalid config, 2 = valid but uses deprecated props.
        # We fail on anything except 0 and 2.
        run: |
          goreleaser check
          code=$?
          if [ $code -ne 0 ] && [ $code -ne 2 ]; then
            echo "::error::goreleaser config is invalid (exit $code)"
            exit $code
          fi

      - name: Snapshot release (no publish)
        # Builds all platform binaries + archives + checksums into ./dist
        # without creating a GitHub release or pushing to tap/bucket.
        # Catches config and cross-compile errors on every PR.
        run: goreleaser release --snapshot --clean --skip=publish
